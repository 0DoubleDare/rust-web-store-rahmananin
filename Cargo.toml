[package]
name = "rust-web-store-rahmananin"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9" }
askama = { version = "0.16.1" }
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["mysql", "runtime-tokio"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tower-sessions = "0.15.0"
serde = { version = "1.0.229" }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23" }
