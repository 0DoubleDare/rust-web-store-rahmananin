<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/static/main.css" />
        <title>{{ base.page_title }}</title>
    </head>
    <body>
        <h1>Продукты</h1>
        <pre>
        {{ filter|json }}
        </pre>
        <form action="/products" method="get">
            <input
                type="number"
                name="in_stock"
                value="{{ filter.in_stock.unwrap_or(0) }}"
                placeholder="Количество"
                required
            />
            <label for="price_from">Цена от</label>
            <input
                type="number"
                name="price_from"
                value="{{ filter.price_from.unwrap_or(0) }}"
                required
            />
            <label for="price_to">Цена до</label>
            <input
                type="number"
                name="price_to"
                value="{{ filter.price_to.unwrap_or(99999999) }}"
                required
            />
            <select name="category_id" required>
                <option value="">Выберите категорию</option>
                <option
                    value="-1"
                    {% if filter.category_id.unwrap_or(-1) < 0 %}
                        selected
                    {% endif %}
                >
                    Все
                </option>
                {% for category in categories %}
                <option
                    value="{{ category.id }}"
                    {% if filter.category_id.unwrap_or(-1) as i32 == category.id %}
                        selected
                    {% endif %}
                >
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
            <button type="submit">Фильтр продуктов</button>
        </form>
        <form action="/products" method="post">
            <input
                type="text"
                name="name"
                placeholder="Введите имя товара"
                required
            />
            <label for="price">Цена</label>
            <input type="number" name="price" value="100" requried />

            <label for="in_stock">Количество</label>
            <input type="number" name="in_stock" value="value" required />

            <select name="category_id" required>
                <option value="">Выберите категорию</option>
                {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
            <button type="submit">Добавить продукт</button>
        </form>
        <table>
            <thead>
                <th>id</th>
                <th>Имя</th>
                <th>Цена</th>
                <th>Осталось</th>
                <th>Контекстное меню</th>
            </thead>
            <tbody>
                {% for product in items %}
                <tr>
                    <th>{{ product.id }}</th>
                    <th>{{ product.name }}</th>
                    <th>{{ product.price }}</th>
                    <th>{{ product.in_stock }}</th>
                    <th>
                        <a href="/products/delete/{{ product.id }}">Удалить</a>
                        <a href="">Изменить</a>
                    </th>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </body>
</html>
